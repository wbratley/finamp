name: Build and Release

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Get version info
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SHORT_SHA="${{ github.sha }}"
          echo "pubspec=${PUBSPEC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=v${PUBSPEC_VERSION//+/-}" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "$KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEY: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Set up release signing
        if: steps.signing.outputs.available == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=/tmp/keystore.jks\n' \
            '${{ secrets.STORE_PASSWORD }}' \
            '${{ secrets.KEY_PASSWORD }}' \
            '${{ secrets.KEY_ALIAS }}' \
            > android/key.properties

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: flutter build apk --release

      - name: Build debug APK (no signing secrets configured)
        if: steps.signing.outputs.available == 'false'
        run: flutter build apk --debug

      - name: Rename APK
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.pubspec }}-${{ steps.version.outputs.short_sha }}"
          RELEASE=build/app/outputs/flutter-apk/app-release.apk
          DEBUG=build/app/outputs/flutter-apk/app-debug.apk
          if [ -f "$RELEASE" ]; then
            DEST="build/app/outputs/flutter-apk/finamp-${VERSION}.apk"
            mv "$RELEASE" "$DEST"
          else
            DEST="build/app/outputs/flutter-apk/finamp-${VERSION}-debug.apk"
            mv "$DEBUG" "$DEST"
          fi
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: finamp-apk
          path: build/app/outputs/flutter-apk/finamp-*.apk

      - name: Create or update release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: "Finamp ${{ steps.version.outputs.tag }}"
          body: |
            **Commit:** [`${{ steps.version.outputs.short_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Built:** ${{ github.event.head_commit.timestamp }}
          allowUpdates: true
          removeArtifacts: true
          artifacts: build/app/outputs/flutter-apk/finamp-*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
